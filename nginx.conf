# Optional: use with the Dockerfile for static preview. NOTE: nginx:alpine does not run PHP,
# so the enquiry forms (submit-*.php) only work on a PHP host (Apache/cPanel or nginx + php-fpm).
server {
    listen 80; root /usr/share/nginx/html; index index.html;
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
    location ~ ^/(tools|legal-src|\.git)/ { return 404; }
    location ~ /(lib|config)\.php$ { return 404; }
}
